apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap 
  fileSystemId: fs-056a2289da8c243cb # your EFS filesystem ID
  directoryPerms: "700" 
  gidRangeStart: "50000" 
  gidRangeEnd: "7000000" 
  basePath: "/dynamic_provisioning" 
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llm-models-volume-2
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs
  nfs:
    path: /tmp
    server: 172.17.0.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-models-2
  namespace: demo-llm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: efs
  volumeMode: Filesystem
---